name: Build and Secure GeoServer Ecosystem

on:
  push:
    branches: ["main"]
  pull_request:            # build + scan only, never pushes
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"    # weekly rebuild for base-image / OS package fixes

env:
  REGISTRY: ghcr.io

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # required to upload scan results

    strategy:
      fail-fast: false         # one failing track must not cancel the other
      matrix:
        include:
          - image_identifier: geoserver-3
            image_name: jw141/geoserver
            dockerfile: Dockerfile
            gs_version: "3.0.2"
            prod_tag: "3.0.2-rockylinux9"
            smoke_test: true
          - image_identifier: geoserver-2-28
            image_name: jw141/geoserver
            dockerfile: Dockerfile.2_28
            gs_version: ""
            prod_tag: "2.28.4--v2026.06.06"
            smoke_test: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4          # pin to a commit SHA for production

      - name: Set up Docker Buildx           # needed for the GHA layer cache
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No manual artifact download any more: the 3.x Dockerfile fetches the stable WAR,
      # verifies Tomcat, and builds fips/cog-s3/cog-http from the matching git tag itself.

      - name: Build and load image (for scanning/testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          build-args: |
            ${{ matrix.gs_version != '' && format('GS_VERSION={0}', matrix.gs_version) || '' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image_name }}:temp-${{ matrix.image_identifier }}
          cache-from: type=gha,scope=${{ matrix.image_identifier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_identifier }}

      - name: Smoke test (starts and serves WMS capabilities)
        if: matrix.smoke_test
        run: |
          docker run -d --name gs -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:temp-${{ matrix.image_identifier }}
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/geoserver/ows?service=wms&version=1.3.0&request=GetCapabilities" >/dev/null 2>&1; then
              echo "up after $i tries"; exit 0
            fi
            sleep 5
          done
          docker logs gs | tail -100; exit 1
        # GitHub runners are not FIPS hosts: this proves the image boots, NOT that FIPS works.
        # Run scripts/verify-fips.sh on a FIPS host for that.

      # Scan findings must never block the build or the push. exit-code "0" ignores findings;
      # continue-on-error also covers scanner/infrastructure failures (DB download rate limits, etc.).
      - name: Run Trivy (table output for logs)
        uses: aquasecurity/trivy-action@0.28.0   # pinned instead of @master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image_name }}:temp-${{ matrix.image_identifier }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"     # report only; set "1" to gate pushes on findings

      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image_name }}:temp-${{ matrix.image_identifier }}
          format: sarif
          output: trivy-results-${{ matrix.image_identifier }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true   # fails on private repos without Code Scanning and on fork PRs
        with:
          sarif_file: trivy-results-${{ matrix.image_identifier }}.sarif
          category: trivy-${{ matrix.image_identifier }}   # without this, matrix runs overwrite each other

      # Re-uses the cached layers from the first build, so this is fast and pushes
      # the same content that was just scanned.
      - name: Build and push production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            ${{ matrix.gs_version != '' && format('GS_VERSION={0}', matrix.gs_version) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.prod_tag }}
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.prod_tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_identifier }}
          provenance: true
          sbom: true