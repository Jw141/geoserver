name: Build and Secure GeoServer

on:
  push:
    branches: ["main"]
  pull_request:            # build + scan only, never pushes
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"    # weekly rebuild for base-image / OS package fixes

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jw141/geoserver
  GS_VERSION: "3.0.2"
  PROD_TAG: "3.0.2-rockylinux9"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # required to upload scan results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4          # pin to a commit SHA for production

      - name: Set up Docker Buildx           # needed for the GHA layer cache
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load image (for scanning/testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          build-args: |
            GS_VERSION=${{ env.GS_VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (starts and serves WMS capabilities)
        run: |
          docker run -d --name gs -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/geoserver/ows?service=wms&version=1.3.0&request=GetCapabilities" >/dev/null 2>&1; then
              echo "up after $i tries"; exit 0
            fi
            sleep 5
          done
          docker logs gs | tail -100; exit 1
        # GitHub runners are not FIPS hosts: this proves the image boots, NOT that FIPS works.
        # Run scripts/verify-fips.sh on a FIPS host for that.

      # Scan findings must never block the build or the push. exit-code "0" ignores findings;
      # continue-on-error also covers scanner/infrastructure failures (DB download rate limits, etc.).
      # SECURITY: pin this action to a full commit SHA you have verified (tags on this action
      # have been tampered with in the past).
      - name: Run Trivy (table output for logs)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true   # fails on private repos without Code Scanning and on fork PRs
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Re-uses the cached layers from the first build, so this is fast and pushes
      # the same content that was just scanned.
      - name: Build and push production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GS_VERSION=${{ env.GS_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PROD_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PROD_TAG }}-${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true